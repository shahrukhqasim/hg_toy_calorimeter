; Calibration samples for the Geant4 11 port: the sim_calibration_dataset_{em,had}_v4 sections of production.ini
; (2000 photons / 2000 charged pions, 1.7 < eta < 2.8, 1 cm in front of the calorimeter), spread over 40 cores.
;   python3 run_simulations.py configuration/calibration_g4_11.ini calib_em_v4
;   python3 run_simulations.py configuration/calibration_g4_11.ini calib_had_v4
;   python3 calibrate.py --sensor-data ../../data/calib_g4_11/em_v4/sensor_data.npz --em ../../data/calib_g4_11/em_v4 \
;           --had ../../data/calib_g4_11/had_v4 --cut 0.0011 --out ../../data/calib_g4_11/calib_v4_cut0.0011.npz

[calib_em_v4]
cores=40
outpath=../../data/calib_g4_11/em_v4
eta_min=1.7
eta_max=2.8
filter_deposited=True
num-simulations-per-file=25
num-simulations=50
pdgid=22
simtype=singlepart_face
calo=v4

[calib_had_v4]
cores=40
outpath=../../data/calib_g4_11/had_v4
eta_min=1.7
eta_max=2.8
filter_deposited=True
num-simulations-per-file=25
num-simulations=50
pdgid=211
simtype=singlepart_face
calo=v4
