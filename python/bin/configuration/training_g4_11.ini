; Training / test dataset for the Geant4 11 port: the train_data_cut11 settings of datasets.ini (60 particles + 200
; pileup kept in a random 0.52 rad (30 deg) phi slice, noise cut 0.0011), produced on the UZH farm (Slurm) into
; /disk/lhcb_data/sqasim/hgcal_toy. Train and test events are mixed from separate simulation libraries.
;
; Simulations (each Slurm task runs one of these with 16 workers; all tasks write into the same folder):
;   python3 run_simulations.py configuration/training_g4_11.ini train_particles      (50 tasks -> 20000)
;   python3 run_simulations.py configuration/training_g4_11.ini train_minbias        (50 tasks -> 8000)
;   python3 run_simulations.py configuration/training_g4_11.ini test_particles       (5 tasks  -> 2000)
;   python3 run_simulations.py configuration/training_g4_11.ini test_minbias         (7 tasks  -> 1120)
; Events (task k: --num-events 200 --first-file 2k):
;   python3 create_dataset.py configuration/training_g4_11.ini train_events --num-events 200 --first-file <2k>
;   python3 create_dataset.py configuration/training_g4_11.ini test_events  --num-events 200 --first-file <2k>

[DEFAULT]
root=/disk/lhcb_data/sqasim/hgcal_toy

[train_particles]
cores=16
outpath=%(root)s/sims/train/particles
pdgid=11,22,111,211
eta_min=1.4
eta_max=3.1
energy_min=1.0
energy_max=200.0
filter_deposited=True
num-simulations-per-file=25
num-simulations=25
simtype=singlepart
calo=v4

[train_minbias]
cores=16
outpath=%(root)s/sims/train/minbias
num-simulations-per-file=10
num-simulations=10
simtype=minbias
calo=v4

[test_particles]
cores=16
outpath=%(root)s/sims/test/particles
pdgid=11,22,111,211
eta_min=1.4
eta_max=3.1
energy_min=1.0
energy_max=200.0
filter_deposited=True
num-simulations-per-file=25
num-simulations=25
simtype=singlepart
calo=v4

[test_minbias]
cores=16
outpath=%(root)s/sims/test/minbias
num-simulations-per-file=10
num-simulations=10
simtype=minbias
calo=v4

[train_events]
noise_cut=0.0011
particles_folder=%(root)s/sims/train/particles
pu_folder=%(root)s/sims/train/minbias
output_folder=%(root)s/events/train
calibration_data=%(root)s/calib/calib_v4_cut0.0011.npz
num_events_total=10000
num_events_per_file=100
compute_spectators_dist=False
num_pu=200
pu_phase_cut=0.52
num_particles=60
num_event_creation_cores=8

[test_events]
noise_cut=0.0011
particles_folder=%(root)s/sims/test/particles
pu_folder=%(root)s/sims/test/minbias
output_folder=%(root)s/events/test
calibration_data=%(root)s/calib/calib_v4_cut0.0011.npz
num_events_total=1000
num_events_per_file=100
compute_spectators_dist=False
num_pu=200
pu_phase_cut=0.52
num_particles=60
num_event_creation_cores=8
