; A few minutes end-to-end check of the pipeline (Geant4 11 / numpy shards), run from python/bin:
;   python3 run_simulations.py configuration/quick_test.ini quick_em      (and quick_had, quick_mix, quick_minbias)
;   python3 calibrate.py --sensor-data ../../data/quick_test/em/sensor_data.npz --em ../../data/quick_test/em \
;           --had ../../data/quick_test/had --out ../../data/quick_test/calib_v4.npz
;   python3 create_dataset.py configuration/quick_test.ini quick_events
; The statistics are far too low for a real calibration.

[quick_em]
cores=4
outpath=../../data/quick_test/em
eta_min=1.7
eta_max=2.8
filter_deposited=True
num-simulations-per-file=10
num-simulations=20
pdgid=22
simtype=singlepart_face
calo=v4

[quick_had]
cores=4
outpath=../../data/quick_test/had
eta_min=1.7
eta_max=2.8
filter_deposited=True
num-simulations-per-file=10
num-simulations=20
pdgid=211
simtype=singlepart_face
calo=v4

[quick_mix]
cores=4
pdgid=11,22,111,211
outpath=../../data/quick_test/mix
eta_min=1.4
eta_max=3.1
energy_min=1.0
energy_max=200.0
filter_deposited=True
num-simulations-per-file=10
num-simulations=25
simtype=singlepart
calo=v4

[quick_minbias]
cores=4
outpath=../../data/quick_test/minbias
num-simulations-per-file=2
num-simulations=2
simtype=minbias
calo=v4

[quick_events]
noise_cut=0.0011
particles_folder=../../data/quick_test/mix
pu_folder=../../data/quick_test/minbias
output_folder=../../data/quick_test/events
calibration_data=../../data/quick_test/calib_v4.npz
num_events_total=6
num_events_per_file=3
num_pu=4
pu_phase_cut=0.52
num_particles=10
num_event_creation_cores=2
